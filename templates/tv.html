    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Service Workshop Tracker - Golden Palace</title>
    <style>
        :root {
            --bg: #f3f5f8;
            --card: #ffffff;
            --text: #172033;
            --muted: #64748b;
            --border: #d9e0e8;
            --shadow: 0 8px 26px rgba(15, 23, 42, .08);
            --progress: #2563eb;
            --collection: #7c3aed;
            --partner: #0f766e;
            --zero: #16a34a;
            --collected: #15803d;
            --partnerclosed: #475569;
            --danger: #dc2626;
            --warning: #d97706;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
        body { overflow-y: auto; }
        button, input { font: inherit; }
        button { cursor: pointer; }

        .page { width: min(1500px, calc(100% - 28px)); margin: 0 auto; padding: 16px 0 34px; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between; gap: 14px;
            background: var(--card); border: 1px solid var(--border); border-radius: 18px;
            padding: 12px 16px; box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 40;
        }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand img { width: 58px; height: 58px; object-fit: contain; border-radius: 12px; }
        .brand h1 { margin: 0; font-size: clamp(21px, 2.4vw, 34px); }
        .brand small { display: block; color: var(--muted); margin-top: 2px; font-size: 13px; }
        .top-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
        .pill, .action-btn {
            border: 1px solid var(--border); background: #fff; color: var(--text); border-radius: 999px;
            min-height: 42px; padding: 8px 14px; font-weight: 700;
        }
        .pill.danger { color: #991b1b; background: #fef2f2; border-color: #fecaca; }
        .pill.ok { color: #166534; background: #f0fdf4; border-color: #bbf7d0; }
        .pill.warn { color: #92400e; background: #fff7ed; border-color: #fed7aa; }
        .action-btn:hover { border-color: #94a3b8; background: #f8fafc; }

        .summary-strip {
            margin: 14px 0; display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px;
        }
        .summary-item { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .summary-item b { font-size: 22px; }
        .summary-item span { color: var(--muted); font-weight: 700; }

        .dashboard-grid {
            display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px;
        }
        .workflow-card {
            position: relative; min-height: 220px; text-align: right; border: 1px solid var(--border); background: var(--card);
            border-radius: 22px; padding: 24px; box-shadow: var(--shadow); overflow: hidden; transition: transform .16s ease, box-shadow .16s ease;
        }
        .workflow-card:hover { transform: translateY(-3px); box-shadow: 0 12px 34px rgba(15,23,42,.13); }
        .workflow-card::after { content: ""; position: absolute; inset: auto 0 0 0; height: 9px; background: var(--accent); }
        .workflow-card .icon { font-size: 38px; }
        .workflow-card .count { font-size: clamp(54px, 6vw, 82px); line-height: .95; font-weight: 900; margin: 14px 0 8px; color: var(--accent); }
        .workflow-card h2 { margin: 0; font-size: clamp(21px, 2.2vw, 30px); }
        .workflow-card p { margin: 8px 0 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
        .workflow-card .open-hint { position: absolute; left: 20px; top: 18px; color: var(--muted); font-weight: 800; font-size: 13px; }
        .progress { --accent: var(--progress); }
        .collection { --accent: var(--collection); }
        .partner { --accent: var(--partner); }
        .zero { --accent: var(--zero); }
        .collected { --accent: var(--collected); }
        .partner_closed { --accent: var(--partnerclosed); }

        .detail-shell { margin-top: 16px; }
        .detail-toolbar {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
        }
        .detail-title h2 { margin: 0; font-size: clamp(24px, 3vw, 38px); }
        .detail-title p { margin: 5px 0 0; color: var(--muted); }
        .detail-controls { display: flex; gap: 8px; flex-wrap: wrap; }
        .search-box { min-width: min(340px, 70vw); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; background: #fff; color: var(--text); }

        .detail-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 12px 0; }
        .stat { background: #fff; border: 1px solid var(--border); border-radius: 13px; padding: 12px; }
        .stat span { display:block; color: var(--muted); font-size: 12px; font-weight: 700; }
        .stat b { display:block; margin-top:4px; font-size: 24px; }

        .ticket-list { display: grid; gap: 10px; }
        .ticket-row {
            width: 100%; border: 1px solid var(--border); background: var(--card); border-radius: 15px; padding: 14px 16px;
            display: grid; grid-template-columns: 150px minmax(180px,1.2fr) minmax(160px,1fr) 120px 150px 170px; gap: 12px;
            align-items: center; text-align: right; box-shadow: 0 2px 8px rgba(15,23,42,.04);
        }
        .ticket-row:hover { border-color: #94a3b8; background: #f8fafc; }
        .ticket-id { font-size: 20px; font-weight: 900; }
        .ticket-row small { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
        .ticket-row .value { font-weight: 700; overflow-wrap: anywhere; }
        .badge { display: inline-flex; align-items:center; border-radius:999px; padding:5px 9px; font-size:12px; font-weight:800; border:1px solid var(--border); background:#f8fafc; }
        .badge.danger { background:#fef2f2; color:#991b1b; border-color:#fecaca; }
        .badge.warn { background:#fff7ed; color:#92400e; border-color:#fed7aa; }
        .badge.ok { background:#f0fdf4; color:#166534; border-color:#bbf7d0; }
        .empty { background:#fff; border:1px dashed #cbd5e1; border-radius:16px; color:var(--muted); padding:35px; text-align:center; font-size:20px; }

        .ticket-panel {
            margin-top: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden;
        }
        .ticket-panel-head { padding: 16px 18px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .ticket-panel-head h3 { margin:0; font-size:26px; }
        .panel-body { padding: 16px; }
        .fields { display:grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap:10px; }
        .field { border:1px solid var(--border); border-radius:12px; padding:11px; min-width:0; background:#fbfcfe; }
        .field label { display:block; color:var(--muted); font-size:11px; font-weight:800; margin-bottom:5px; }
        .field div { font-weight:700; overflow-wrap:anywhere; white-space:pre-wrap; }
        .history { margin-top:12px; border:1px solid var(--border); border-radius:12px; padding:12px; background:#0f172a; color:#e2e8f0; line-height:1.7; direction:rtl; white-space:normal; }
        .panel-actions { margin-top:14px; display:flex; flex-wrap:wrap; gap:8px; }
        .close-ticket-btn { border:0; border-radius:12px; padding:12px 18px; background:#166534; color:white; font-weight:900; }
        .close-ticket-btn:disabled { opacity:.5; cursor:not-allowed; }

        .remarks-list { display:grid; gap:10px; }
        .remark-row { display:flex; align-items:center; justify-content:space-between; gap:12px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:14px; }
        .remark-row span { font-weight:700; line-height:1.5; }
        .remark-close { border:1px solid #fecaca; color:#991b1b; background:#fef2f2; border-radius:10px; padding:8px 12px; font-weight:900; white-space:nowrap; }

        .toast { position: fixed; bottom: 18px; left: 18px; z-index: 99; max-width: min(460px, calc(100% - 36px)); border-radius: 14px; padding: 12px 16px; background: #0f172a; color: #fff; box-shadow: var(--shadow); display:none; direction:ltr; text-align:left; }
        .toast.show { display:block; }

        /* ======================================================
           32-INCH TV MAIN VIEW
           Optimised for 1920x1080 and still comfortable at 1366x768.
           Details stay scrollable because they open in a separate window/tab.
           ====================================================== */
        body.main-view-body { height: 100vh; overflow: hidden; }
        body.main-view-body .page {
            width: min(1880px, calc(100% - 20px));
            height: 100vh;
            margin: 0 auto;
            padding: 9px 0 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body.main-view-body .topbar {
            position: static;
            flex: 0 0 auto;
            border-radius: 15px;
            padding: 8px 12px;
        }
        body.main-view-body .brand img { width: 48px; height: 48px; }
        body.main-view-body .brand h1 { font-size: clamp(21px, 1.8vw, 30px); }
        body.main-view-body .brand small { font-size: 11px; }
        body.main-view-body #mainView {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        body.main-view-body .summary-strip {
            flex: 0 0 auto;
            margin: 8px 0;
            gap: 8px;
        }
        body.main-view-body .summary-item {
            padding: 7px 12px;
            min-height: 50px;
        }
        body.main-view-body .summary-item b { font-size: clamp(22px, 2vw, 34px); }
        body.main-view-body .summary-item span { font-size: clamp(14px, 1.15vw, 19px); }
        body.main-view-body .dashboard-grid {
            flex: 1 1 auto;
            min-height: 0;
            margin-top: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 11px;
        }
        body.main-view-body .workflow-card {
            min-height: 0;
            height: 100%;
            padding: clamp(15px, 1.25vw, 24px);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        body.main-view-body .workflow-card .icon { font-size: clamp(30px, 2.7vw, 48px); }
        body.main-view-body .workflow-card .count {
            font-size: clamp(62px, 5.7vw, 104px);
            margin: clamp(6px, .7vw, 12px) 0 5px;
        }
        body.main-view-body .workflow-card h2 { font-size: clamp(23px, 2vw, 36px); }
        body.main-view-body .workflow-card p {
            font-size: clamp(12px, .95vw, 17px);
            margin-top: 5px;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        body.main-view-body .workflow-card .open-hint {
            left: 15px; top: 13px; font-size: clamp(10px, .8vw, 13px);
        }

        .voice-btn.on { color:#166534; background:#f0fdf4; border-color:#86efac; }
        .voice-btn.off { color:#475569; background:#f8fafc; }
        .voice-btn.blocked { color:#92400e; background:#fff7ed; border-color:#fed7aa; }
        #voiceTestButton { min-width: 44px; padding-inline: 11px; }
        body.detail-view-body #voiceButton,
        body.detail-view-body #voiceTestButton { display:none !important; }

        .voice-caption {
            position: fixed;
            z-index: 110;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: min(900px, calc(100% - 36px));
            padding: 12px 18px;
            border-radius: 15px;
            background: rgba(15,23,42,.94);
            color: #fff;
            text-align: center;
            direction: rtl;
            font-size: clamp(17px, 1.35vw, 24px);
            font-weight: 800;
            box-shadow: 0 12px 36px rgba(15,23,42,.25);
            display: none;
        }
        .voice-caption.show { display:block; }

        @media (max-height: 820px) and (min-width: 901px) {
            body.main-view-body .page { padding-top: 6px; padding-bottom: 6px; }
            body.main-view-body .topbar { padding: 6px 10px; }
            body.main-view-body .brand img { width: 42px; height: 42px; }
            body.main-view-body .summary-strip { margin: 6px 0; }
            body.main-view-body .summary-item { min-height: 44px; padding: 5px 10px; }
            body.main-view-body .workflow-card { padding: 12px 16px; }
            body.main-view-body .workflow-card .count { font-size: clamp(54px, 5.2vw, 78px); margin: 4px 0; }
            body.main-view-body .workflow-card h2 { font-size: clamp(20px, 1.75vw, 27px); }
            body.main-view-body .workflow-card p { font-size: 12px; line-height: 1.25; }
        }

        @media (max-width: 1100px) {
            .dashboard-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
            .ticket-row { grid-template-columns: 130px minmax(180px,1fr) minmax(150px,1fr) 110px; }
            .ticket-row .optional-col { display:none; }
            .fields { grid-template-columns: repeat(2,minmax(0,1fr)); }
        }
        @media (max-width: 700px) {
            .page { width: min(100% - 14px, 1500px); padding-top: 7px; }
            .topbar { position: static; align-items:flex-start; }
            .brand img { width:46px;height:46px; }
            .dashboard-grid, .summary-strip { grid-template-columns: 1fr; }
            .workflow-card { min-height: 180px; }
            .detail-stats { grid-template-columns: repeat(2,minmax(0,1fr)); }
            .ticket-row { grid-template-columns: 110px minmax(0,1fr); }
            .ticket-row .mobile-hide { display:none; }
            .fields { grid-template-columns: 1fr; }
            .search-box { min-width: 100%; }
        }

        /* ======================================================

           HTML, so there is no extra image request and no risk of
           uploading the wrong/cropped static file.
           ====================================================== */

    function saveDashboardSnapshot(data) {

        } catch (_) {}
    }

    function loadDashboardSnapshot() {
        if (detailMode) return null;
        try {

            if (!parsed || !parsed.data || !parsed.savedAt) return null;
            if ((Date.now() - Number(parsed.savedAt)) > 12 * 60 * 60 * 1000) return null;
            return parsed.data;
        } catch (_) { return null; }
    }

    function safe(v, fallback='—') {
        if (v === null || v === undefined) return fallback;
        const s = String(v).trim();
        return (!s || s.toLowerCase() === 'nan' || s.toLowerCase() === 'none') ? fallback : s;
    }

    function esc(v) {
        return safe(v, '').replace(/[&<>'\"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[ch]));
    }

    function num(v) {
        const n = Number(v);
        return Number.isFinite(n) ? n : 0;
    }

    function fmtAmount(v) {
        return num(v).toLocaleString(undefined, {minimumFractionDigits:0, maximumFractionDigits:3});

    let teamVoiceEnabled = false;
    let teamVoiceTimer = null;
    let teamVoicePlaying = false;
    let teamVoiceAudio = null;
    let lastVoicePerson = '';
    let lastVoiceCategory = '';

    function shuffledCopy(items) {
        const a = items.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function loadRotationState() {
        try {
            const raw = JSON.parse(localStorage.getItem(TEAM_VOICE_STORAGE_KEY) || '{}');
            return {
                remaining: Array.isArray(raw.remaining) ? raw.remaining.filter(id => teamVoiceCatalog.some(x => x.id === id)) : [],
                played: Array.isArray(raw.played) ? raw.played : [],
                lastPerson: String(raw.lastPerson || ''),
                lastCategory: String(raw.lastCategory || '')
            };
        } catch (_) { return {remaining:[], played:[], lastPerson:'', lastCategory:''}; }
    }

    function saveRotationState(state) {
        try { localStorage.setItem(TEAM_VOICE_STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
    }

    function refillRotation(state) {
        const categories = ['golden','motivation','person','workshop','management'];
        const buckets = Object.fromEntries(categories.map(c => [c, shuffledCopy(teamVoiceCatalog.filter(x => x.category === c))]));
        const result = [];
        let previousPerson = state.lastPerson || '';
        let previousCategory = state.lastCategory || '';
        while (result.length < teamVoiceCatalog.length) {
            let availableCategories = categories.filter(c => buckets[c].length && c !== previousCategory);
            if (!availableCategories.length) availableCategories = categories.filter(c => buckets[c].length);
            if (!availableCategories.length) break;
            availableCategories.sort((a,b) => buckets[b].length - buckets[a].length);
            let chosenCategory = availableCategories[0];
            let bucket = buckets[chosenCategory];
            let idx = bucket.findIndex(x => !x.person || x.person !== previousPerson);
            if (idx < 0) idx = 0;
            const [track] = bucket.splice(idx,1);
            result.push(track.id);
            previousPerson = track.person || '';
            previousCategory = track.category;
        }
        state.remaining = result;
        state.played = [];
        saveRotationState(state);
    }

    function chooseVoiceTrack() {
        const state = loadRotationState();
        if (!state.remaining.length) refillRotation(state);
        let candidates = state.remaining.map(id => teamVoiceCatalog.find(x => x.id === id)).filter(Boolean);
        if (!candidates.length) { refillRotation(state); candidates = state.remaining.map(id => teamVoiceCatalog.find(x => x.id === id)).filter(Boolean); }
        let idx = candidates.findIndex(x => (!x.person || x.person !== state.lastPerson) && x.category !== state.lastCategory);
        if (idx < 0) idx = candidates.findIndex(x => !x.person || x.person !== state.lastPerson);
        if (idx < 0) idx = 0;
        const track = candidates[idx];
        state.remaining = state.remaining.filter(id => id !== track.id);
        state.played.push(track.id);
        state.lastPerson = track.person || '';
        state.lastCategory = track.category || '';
        saveRotationState(state);
        lastVoicePerson = state.lastPerson;
        lastVoiceCategory = state.lastCategory;
        return track;
    }

    function updateVoiceButton(state) {
        const btn = document.getElementById('voiceButton');
        if (!btn) return;
        btn.classList.remove('on','off','blocked');
        if (state === 'blocked') { btn.classList.add('blocked'); btn.textContent = tr('voiceBlocked'); return; }
        if (teamVoiceEnabled) { btn.classList.add('on'); btn.textContent = tr('voiceOn'); }
        else { btn.classList.add('off'); btn.textContent = tr('voiceOff'); }
    }

    function setVoiceCaption(text, visible) {
        const el = document.getElementById('voiceCaption');
        if (!el) return;
        el.textContent = text || '';
        el.classList.toggle('show', Boolean(visible && text));
    }

    function stopTeamVoiceAudio() {
        try {
            if (teamVoiceAudio) { teamVoiceAudio.pause(); teamVoiceAudio.currentTime = 0; }
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        } catch (_) {}
        teamVoiceAudio = null;
        teamVoicePlaying = false;
        setVoiceCaption('', false);
    }

    function speakFallback(track) {
        if (!('speechSynthesis' in window)) return false;
        try {
            const u = new SpeechSynthesisUtterance(track.text);
            u.lang = track.lang === 'en' ? 'en-GB' : 'ar-SA';
            u.rate = 1.08;
            u.pitch = 1.28; // brighter/higher-pitched fallback voice
            u.volume = 1.0;
            const voices = window.speechSynthesis.getVoices();
            const femaleHints = ['female','zira','samantha','sara','salma','hoda','mageda','laila','maryam','nora'];
            const langPrefix = track.lang === 'en' ? 'en' : 'ar';
            const matching = voices.filter(v => String(v.lang || '').toLowerCase().startsWith(langPrefix));
            const preferred = matching.find(v => femaleHints.some(h => String(v.name || '').toLowerCase().includes(h))) || matching[0];
            if (preferred) u.voice = preferred;
            u.onend = () => { teamVoicePlaying=false; setVoiceCaption('',false); };
            u.onerror = () => { teamVoicePlaying=false; setVoiceCaption('',false); };
            teamVoicePlaying = true;
            setVoiceCaption(track.text, true);
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(u);
            return true;
        } catch (_) { return false; }
    }

    function playTeamVoice(track, manual=false) {
        if (!track || detailMode || teamVoicePlaying) return false;
        if (!manual && (!teamVoiceEnabled || document.hidden)) return false;
        try {
            stopTeamVoiceAudio();
            if (!track.url) return speakFallback(track);
            const audio = new Audio(track.url);
            audio.preload = 'auto';
            audio.volume = TEAM_VOICE_VOLUME;
            teamVoiceAudio = audio;
            teamVoicePlaying = true;
            setVoiceCaption(track.text, true);
            const finish = () => {
                if (teamVoiceAudio === audio) teamVoiceAudio = null;
                teamVoicePlaying = false;
                setVoiceCaption('', false);
            };
            audio.addEventListener('ended', finish, {once:true});
            audio.addEventListener('error', () => { finish(); speakFallback(track); }, {once:true});
            const promise = audio.play();
            if (promise && typeof promise.catch === 'function') promise.catch(() => { finish(); if (!speakFallback(track)) updateVoiceButton('blocked'); });
            return true;
        } catch (_) { return speakFallback(track); }
    }

    function scheduleNextTeamVoice(delay=TEAM_VOICE_INTERVAL_MS) {
        clearTimeout(teamVoiceTimer);
        teamVoiceTimer = null;
        if (detailMode || !teamVoiceEnabled) return;
        teamVoiceTimer = setTimeout(() => {
            try {
                if (!teamVoiceEnabled || document.hidden || teamVoicePlaying) { scheduleNextTeamVoice(TEAM_VOICE_RETRY_MS); return; }
                const ok = playTeamVoice(chooseVoiceTrack(), false);
                scheduleNextTeamVoice(ok ? TEAM_VOICE_INTERVAL_MS : TEAM_VOICE_RETRY_MS);
            } catch (_) { scheduleNextTeamVoice(TEAM_VOICE_RETRY_MS); }
        }, Math.max(1000, delay));
    }

    function toggleTeamVoice() {
        if (detailMode) return;
        try {
            teamVoiceEnabled = !teamVoiceEnabled;
            localStorage.setItem('gpFemaleVoiceEnabled', teamVoiceEnabled ? '1' : '0');
            if (!teamVoiceEnabled) {
                clearTimeout(teamVoiceTimer);
                stopTeamVoiceAudio();
                updateVoiceButton();
                showToast(tr('voiceDisabled'));
                return;
            }
            updateVoiceButton();
            const ok = playTeamVoice(chooseVoiceTrack(), true);
            if (!ok) updateVoiceButton('blocked'); else showToast(tr('voiceEnabled'));
            scheduleNextTeamVoice();
        } catch (_) { updateVoiceButton('blocked'); }
    }

    function testTeamVoice() {
        if (detailMode) return;
        try {
            const ok = playTeamVoice(chooseVoiceTrack(), true);
            if (ok) showToast(tr('voicePlaying')); else showToast(tr('audioBlocked'), 7000);
        } catch (_) { showToast(tr('audioBlocked'), 7000); }
    }

    function initialiseTeamVoice() {
        if (detailMode) return;
        try { teamVoiceEnabled = localStorage.getItem('gpFemaleVoiceEnabled') !== '0'; }
        catch (_) { teamVoiceEnabled = true; }
        updateVoiceButton();
        if (teamVoiceEnabled) scheduleNextTeamVoice();
    }

    function gpPick(a){return a[Math.floor(Math.random()*a.length)];}

    function buildDynamicVoiceTrack(){
      const lang=currentLanguage==='ar'?'ar':'en',b=GP_VOICE_BANK[lang],r=Math.random();let text='',category='motivation',tone='warm',person='';
      if(r<.16){category='management';person=GP_MANAGER[lang];text=`${gpPick(b.manager)}. ${gpPick(b.ends)}.`}
      else if(r<.38){category='funny';tone='funny';text=`${gpPick(b.starts)}، ${gpPick(b.funny)}. ${gpPick(b.ends)}.`}
      else if(r<.58){category='person';person=gpPick(GP_STAFF[lang]);tone=Math.random()<.45?'funny':'warm';text=`${gpPick(b.person).replace('{name}',person)}. ${gpPick(b.ends)}.`}
      else if(r<.84){text=`${gpPick(b.starts)}، ${gpPick(b.motivation)}، ${gpPick(b.action)}. ${gpPick(b.ends)}.`}
      else{category='workshop';text=`${gpPick(b.starts)}، ${gpPick(b.action)}. ${gpPick(b.motivation)}. ${gpPick(b.ends)}.`}
      return{id:`dyn-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,category,person,text:text.replace(/\s+/g,' ').trim(),url:'',lang,tone}
    }
    function chooseVoiceTrack(){const recent=gpRecentVoice();let track=buildDynamicVoiceTrack();for(let i=0;i<50&&recent.includes(track.text);i++)track=buildDynamicVoiceTrack();gpRememberVoice(track.text);return track}

    function gpVoiceName(v){return String((v&&v.name)||'').toLowerCase()}
    function gpVoiceLang(v){return String((v&&v.lang)||'').toLowerCase().replace('_','-')}
    function findAmanySyrianVoice(){
      if(!('speechSynthesis' in window)) return null;
      const voices=window.speechSynthesis.getVoices()||[];
      return voices.find(v=>gpVoiceLang(v)==='ar-sy' && gpVoiceName(v).includes('amany'))
          || voices.find(v=>gpVoiceName(v).includes('amany') && (gpVoiceName(v).includes('syria')||gpVoiceLang(v)==='ar-sy'))
          || voices.find(v=>gpVoiceName(v).includes('ar-sy-amanyneural'))
          || null;
    }
    function findEnglishFemaleVoice(){
      if(!('speechSynthesis' in window)) return null;
      const voices=window.speechSynthesis.getVoices()||[], hints=['female','zira','samantha','sara','jenny','aria','ava','emma','sonia','libby'];
      return voices.find(v=>gpVoiceLang(v).startsWith('en')&&hints.some(h=>gpVoiceName(v).includes(h))) || voices.find(v=>gpVoiceLang(v).startsWith('en')) || null;
    }
    function refreshExactVoiceStatus(){

    function speakFallback(track){
      if(!('speechSynthesis'in window)||!track)return false;
      try{
        const isAr=track.lang==='ar';
        const preferred=isAr?findAmanySyrianVoice():findEnglishFemaleVoice();
        if(isAr && !preferred){
          teamVoicePlaying=false;setVoiceCaption('',false);updateVoiceButton('blocked');
          showToast(currentLanguage==='ar'?'صوت أماني السوري النسائي الطبيعي غير موجود بهالمتصفح. افتح الشاشة بMicrosoft Edge.':'Amany Syrian female natural voice is unavailable. Open the TV in Microsoft Edge.',9000);
          return false;
        }
        const u=new SpeechSynthesisUtterance(track.text);
        u.lang=isAr?'ar-SY':'en-US';
        u.voice=preferred||null;
        u.rate=track.tone==='funny'?1.08:1.00;
        u.pitch=track.tone==='funny'?1.08:1.02;
        u.volume=1;
        u.onend=()=>{teamVoicePlaying=false;setVoiceCaption('',false)};
        u.onerror=()=>{teamVoicePlaying=false;setVoiceCaption('',false)};
        teamVoicePlaying=true;setVoiceCaption(track.text,true);window.speechSynthesis.cancel();window.speechSynthesis.speak(u);return true
      }catch(_){return false}
    }

    const GP_CEECEE_ROTATION_KEY='gpCeeceeActivationRotationV2';
    function gpShuffleCopy(items){const a=items.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function gpLoadCeeceeBag(lang){
        const catalog=GP_CEECEE_ACTIVATION_CATALOG[lang]||[];
        try{
            const stored=JSON.parse(localStorage.getItem(`${GP_CEECEE_ROTATION_KEY}:${lang}`)||'[]');
            const valid=Array.isArray(stored)?stored.filter(id=>catalog.some(x=>x.id===id)):[];
            if(valid.length)return valid;
        }catch(_){}
        const bag=gpShuffleCopy(catalog.map(x=>x.id));
        try{localStorage.setItem(`${GP_CEECEE_ROTATION_KEY}:${lang}`,JSON.stringify(bag));}catch(_){}
        return bag;
    }
    function chooseCeeceeActivationTrack(){
        const lang=currentLanguage==='ar'?'ar':'en', catalog=GP_CEECEE_ACTIVATION_CATALOG[lang]||[];
        let bag=gpLoadCeeceeBag(lang); if(!bag.length)return null;
        const id=bag.shift(); try{localStorage.setItem(`${GP_CEECEE_ROTATION_KEY}:${lang}`,JSON.stringify(bag));}catch(_){}
        return catalog.find(x=>x.id===id)||catalog[0]||null;
    }
    async function playCeeceeActivationTrack(track){
        if(!track)return false;
        try{
            stopTeamVoiceAudio();
            const audio=new Audio(track.url); audio.preload='auto'; audio.volume=TEAM_VOICE_VOLUME;
            teamVoiceAudio=audio; teamVoicePlaying=true; setVoiceCaption(track.text,true);
            await new Promise((resolve,reject)=>{audio.addEventListener('ended',resolve,{once:true});audio.addEventListener('error',reject,{once:true});audio.play().catch(reject)});
            teamVoiceAudio=null; teamVoicePlaying=false; setVoiceCaption('',false); return true;
        }catch(_){teamVoiceAudio=null;teamVoicePlaying=false;setVoiceCaption('',false);return false;}
    }
    async function playTeamVoice(_ignoredTrack=null,manual=false){
        if(detailMode||teamVoicePlaying)return false;
        if(!manual&&(!teamVoiceEnabled||document.hidden))return false;
        return await playCeeceeActivationTrack(chooseCeeceeActivationTrack());
    }
    function scheduleNextTeamVoice(delay=TEAM_VOICE_INTERVAL_MS){
        clearTimeout(teamVoiceTimer);teamVoiceTimer=null;if(detailMode||!teamVoiceEnabled)return;
        teamVoiceTimer=setTimeout(async()=>{
            if(!teamVoiceEnabled||document.hidden||teamVoicePlaying){scheduleNextTeamVoice(TEAM_VOICE_RETRY_MS);return;}
            const ok=await playTeamVoice(null,false);scheduleNextTeamVoice(ok?TEAM_VOICE_INTERVAL_MS:TEAM_VOICE_RETRY_MS);
        },Math.max(1000,delay));
    }
    async function toggleTeamVoice(){
        if(detailMode)return;
        teamVoiceEnabled=!teamVoiceEnabled;
        try{localStorage.setItem('gpFemaleVoiceEnabled',teamVoiceEnabled?'1':'0');}catch(_){}
        if(!teamVoiceEnabled){clearTimeout(teamVoiceTimer);stopTeamVoiceAudio();updateVoiceButton();showToast(tr('voiceDisabled'));return;}
        updateVoiceButton();
        const ok=await playTeamVoice(null,true);
        if(ok)showToast(tr('voiceEnabled'));else showToast(tr('audioBlocked'),7000);
        scheduleNextTeamVoice();
    }
    function initialiseTeamVoice(){
        if(detailMode)return;
        try{teamVoiceEnabled=localStorage.getItem('gpFemaleVoiceEnabled')!=='0';}catch(_){teamVoiceEnabled=true;}
        updateVoiceButton();
        if(teamVoiceEnabled)scheduleNextTeamVoice(7000);
    }



    // GP_LEVANTINE_VOICE_V4
    // Dynamic, browser-independent Levantine female voice.
    // This override intentionally comes after the old Ceecee catalog so Enable/Disable uses
    // the new dynamic content while the exact Ceecee test can remain available for comparison.
    let gpDynamicVoicePrefetchV4 = null;

    async function gpFetchServerVoiceTrackV4(manual=false){
        const slot=gpNextStaffPerson();
        const response=await fetch(apiUrl(`/api/voice-track?lang=${encodeURIComponent(currentLanguage)}&person=${encodeURIComponent(slot.name)}&manual=${manual?'1':'0'}&t=${Date.now()}`),{cache:'no-store'});
        if(!response.ok) throw new Error(`voice ${response.status}`);
        const track=await response.json();
        if(!track||!track.ok||!Array.isArray(track.audio_urls)||!track.audio_urls.length) throw new Error('invalid voice track');
        track.urls=track.audio_urls.map(apiUrl);track._staffSlot=slot;return track;
    }
    function gpPrefetchDynamicLevantine(){
        if(!gpDynamicVoicePrefetchV4) gpDynamicVoicePrefetchV4=gpFetchServerVoiceTrackV4(false).catch(()=>null);
        return gpDynamicVoicePrefetchV4;
    }
    async function gpPlayDynamicLevantine(track){
        if(!track)return false;
        try{
            teamVoicePlaying=true;setVoiceCaption(track.text,true);
            for(let i=0;i<track.urls.length;i++){
                const audio=new Audio(track.urls[i]);audio.preload='auto';audio.volume=TEAM_VOICE_VOLUME;teamVoiceAudio=audio;
                await new Promise((resolve,reject)=>{audio.addEventListener('ended',resolve,{once:true});audio.addEventListener('error',reject,{once:true});audio.play().catch(reject)});
                if(i<track.urls.length-1)await new Promise(r=>setTimeout(r,160));
            }
            gpCommitStaffPerson(track._staffSlot);teamVoiceAudio=null;teamVoicePlaying=false;setVoiceCaption('',false);return true;
        }catch(_){teamVoiceAudio=null;teamVoicePlaying=false;setVoiceCaption('',false);return false;}
    }
    async function playTeamVoice(_ignoredTrack=null,manual=false){
        if(detailMode||teamVoicePlaying)return false;
        if(!manual&&(!teamVoiceEnabled||document.hidden))return false;
        stopTeamVoiceAudio();let track=null;
        try{track=await(gpDynamicVoicePrefetchV4||gpFetchServerVoiceTrackV4(manual));}catch(_){track=null;}
        gpDynamicVoicePrefetchV4=null;
        if(!track){updateVoiceButton('blocked');return false;}
        const ok=await gpPlayDynamicLevantine(track);
        if(ok){updateVoiceButton();gpPrefetchDynamicLevantine();}else updateVoiceButton('blocked');
        return ok;
    }
    function scheduleNextTeamVoice(delay=TEAM_VOICE_INTERVAL_MS){
        clearTimeout(teamVoiceTimer);teamVoiceTimer=null;if(detailMode||!teamVoiceEnabled)return;
        teamVoiceTimer=setTimeout(async()=>{
            if(!teamVoiceEnabled||document.hidden||teamVoicePlaying){scheduleNextTeamVoice(TEAM_VOICE_RETRY_MS);return;}
            const ok=await playTeamVoice(null,false);scheduleNextTeamVoice(ok?TEAM_VOICE_INTERVAL_MS:TEAM_VOICE_RETRY_MS);
        },Math.max(1000,delay));
    }
    async function toggleTeamVoice(){
        if(detailMode)return;
        teamVoiceEnabled=!teamVoiceEnabled;
        try{localStorage.setItem('gpFemaleVoiceEnabled',teamVoiceEnabled?'1':'0');}catch(_){}
        if(!teamVoiceEnabled){clearTimeout(teamVoiceTimer);stopTeamVoiceAudio();updateVoiceButton();showToast(tr('voiceDisabled'));return;}
        updateVoiceButton();gpPrefetchDynamicLevantine();
        const ok=await playTeamVoice(null,true);
        if(ok)showToast(tr('voiceEnabled'));else showToast(tr('audioBlocked'),7000);
        scheduleNextTeamVoice();
    }
    function initialiseTeamVoice(){
        if(detailMode)return;
        try{teamVoiceEnabled=localStorage.getItem('gpFemaleVoiceEnabled')!=='0';}catch(_){teamVoiceEnabled=true;}
        updateVoiceButton();gpPrefetchDynamicLevantine();if(teamVoiceEnabled)scheduleNextTeamVoice(7000);
    }

        {text:'أبو نقطة، كل حالة إلها قصة، بس ما بدنا القصة تطول. حدّثها بوقتها وخلي آخر سطر واضح: تم الإنجاز.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/195a5335-090c-4430-9753-646f7e4c4ed8.mp3'},

      {name:'عمر',tracks:[
        {text:'عمر، بلّش بالأقدم وخفّف قائمة الانتظار حالة ورا حالة، بس خليك دقيق بكل تحديث. ممتاز، هيك بدنا.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a6c39513-90bf-4491-a8f8-0232692d1b65.mp3'},
        {text:'عمر، إذا الحالة جاهزة لا تخليها تستنى، وإذا مو جاهزة خلي السبب معروف. هيك منخفف التأخير ونمشي أسرع.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b1fe02ab-3e50-46d6-b393-a58ddca9018b.mp3'},
        {text:'عمر، إذا قائمة الانتظار عم تكبر أسرع من القهوة عم تخلص، معناتها بدنا نسرّع شوي. خلّينا ننقصها حالة ورا حالة قبل ما تطلب مكتب لحالها.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8627e48c-aa36-4697-93ab-71e07fc1a193.mp3'}]},
      {name:'أبو آدم',tracks:[
        {text:'أبو آدم، أولوية العمليات اليوم للحالات المتأخرة. كل حالة لازم يكون إلها مسؤول واضح وخطوة جاية واضحة. تمام.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/68422110-6207-49f1-bd77-2b7a4981452e.mp3'},

        {text:'أبو آدم، إذا كل تطوير صغير فتحلنا ثلاث أفكار تطوير جديدة، معناتها العمليات عندك ما عاد إلها نهاية. بس طالما الداشبورد عم يخضر، منسامحك هالمرة.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/38018934-84a6-4d6a-b21f-6e3b67fb1612.mp3'}]},
      {name:'حريري',tracks:[
        {text:'حريري، ركّز اليوم عالأعطال الكهربائية. فحص مرتب، قياس واضح، وما نبدّل قطعة قبل ما نعرف السبب. يعطيك العافية.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8388e59d-f4ef-421f-b12b-7d3d55325312.mp3'},
        {text:'حريري، إذا العطل كهربائي خليه يمر عليك من أولها. بدنا تشخيص دقيق، توصيلات مرتبة، والحالة تتحدّث أول بأول.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cbc9e259-062d-4860-9d4c-ef7ea488d2e0.mp3'},
        {text:'حريري، إذا الكهربا قررت تلعب غميضة اليوم، خليك أهدى منها. قيسها صح قبل ما تبدّل نص الجهاز وتكتشف إنو المشكلة من فيشة.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/a46b1f11-2645-4d4f-9e52-5ff31520e146.mp3'}]},
      {name:'أبو غسان',tracks:[
        {text:'أبو غسان، قبل ما تطلع عالموقع تأكّد إنو الأدوات والقطع المطلوبة معك، وبعد الزيارة حدّث الحالة دغري. يعطيك العافية.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d34c52bc-4334-43bd-8011-75738ba23da5.mp3'},
        {text:'أبو غسان، شغلك بالموقع هو واجهة القصر الذهبي. خليك واضح مع الزبون، خلّص المطلوب، ورجّع كل التفاصيل عالنظام.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/8c239db0-1c08-4469-bf9c-b57fc44779c0.mp3'},
        {text:'أبو غسان، قبل ما تطلع عالموقع تأكّد إنو كل شي معك، لأنو أسوأ شي توصل لعند الزبون وتكتشف إنو القطعة المهمة بعدها عم تتفرج علينا من المستودع.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/31844648-2506-454d-9014-ec434fc4c6b8.mp3'}]},
      {name:'حازم',tracks:[
        {text:'حازم، يعطيك العافية. خلّي المكتب مرتب والضيافة جاهزة، وإذا ناقص شي خبرنا من بكير. هيك الشغل المرتب.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d5bdfb4d-5b56-4183-9dd1-8dfe0f184c0a.mp3'},
        {text:'حازم، اليوم بدنا المكتب يضل مرتب وكل طلب يوصل بوقته. شغلك بالمكتب بيسهّل يوم الكل. تمام.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/37226c6c-0637-4bb0-ae86-d81311bbc182.mp3'},
        {text:'حازم، إذا القهوة خلصت قبل الشغل اليوم، اعتبرها حالة طوارئ مكتبية. بس لا تخلي الضيافة أسرع من الطلبات، بدنا الاتنين يوصلوا بوقتهم.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4f1ef095-2973-41ca-b937-0a43c4d8d2eb.mp3'}]}
    ];
    const GP_CRISP_GENERAL = [
      {text:'يعطيكم العافية يا شباب القصر الذهبي. خلّونا اليوم نخلي قائمة المنجز أطول من قائمة الانتظار، وكل حالة تنتقل للخطوة الجاية بوضوح.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/26266cdd-e0ad-4459-a58f-4b46a59b7712.mp3'},
      {text:'شباب القصر الذهبي، الجهاز اللي مفكّر يقضي عطلة عنا خبرّوه إنو الحجز فل. خلّونا نخلّص الجاهز ونحدّث كل حالة بوقتها.',url:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4cb737d7-18f1-4a00-b846-02399e9332ac.mp3'}
    ];
    const GP_CRISP_STAFF_INDEX='gpCrispStaffIndexV6';
    const GP_CRISP_VARIANT_INDEX='gpCrispVariantIndexV6';
    const GP_CRISP_GENERAL_INDEX='gpCrispGeneralIndexV6';
    let gpCrispReferencePlayed=false;

    function gpReadIndex(key,mod){try{return Math.abs(parseInt(localStorage.getItem(key)||'0',10)||0)%mod}catch(_){return 0}}
    function gpWriteIndex(key,value){try{localStorage.setItem(key,String(value))}catch(_){}}
    function gpNextCrispStaffTrack(){
      const staffIdx=gpReadIndex(GP_CRISP_STAFF_INDEX,GP_CRISP_STAFF.length);
      const person=GP_CRISP_STAFF[staffIdx];
      const variantKey=`${GP_CRISP_VARIANT_INDEX}:${person.name}`;
      const variantIdx=gpReadIndex(variantKey,person.tracks.length);
      const track={...person.tracks[variantIdx],person:person.name};
      gpWriteIndex(variantKey,(variantIdx+1)%person.tracks.length);
      gpWriteIndex(GP_CRISP_STAFF_INDEX,(staffIdx+1)%GP_CRISP_STAFF.length);
      return track;
    }
    function gpNextCrispGeneral(){
      const idx=gpReadIndex(GP_CRISP_GENERAL_INDEX,GP_CRISP_GENERAL.length);
      gpWriteIndex(GP_CRISP_GENERAL_INDEX,(idx+1)%GP_CRISP_GENERAL.length);
      return {...GP_CRISP_GENERAL[idx],person:''};
    }
    function gpChooseCrispTrack(manual=false){
      if(manual && !gpCrispReferencePlayed){gpCrispReferencePlayed=true;return {text:'يعطيكم العافية يا شباب القصر الذهبي. اليوم بدنا نخلّص الحالات المتأخرة، ونخلي كل خطوة واضحة. حريري، أبو غسان، حازم، وأبو آدم، شدّوا الهمة وخلو الشغل مرتب. هيك بدنا الشغل.',url:GP_CRISP_REFERENCE_URL,person:''};}
      // One general line after each full 8-person staff cycle. Staff mentions remain exactly balanced.
      const staffIdx=gpReadIndex(GP_CRISP_STAFF_INDEX,GP_CRISP_STAFF.length);
      if(!manual && staffIdx===0 && gpReadIndex('gpCrispCycleSeenV6',2)===1){gpWriteIndex('gpCrispCycleSeenV6',0);return gpNextCrispGeneral();}
      if(!manual && staffIdx===0)gpWriteIndex('gpCrispCycleSeenV6',1);
      return gpNextCrispStaffTrack();
    }
    async function gpPlayCrispTrack(track){
      if(!track||!track.url)return false;
      try{
        stopTeamVoiceAudio();
        const audio=new Audio(track.url);audio.preload='auto';audio.volume=TEAM_VOICE_VOLUME;
        teamVoiceAudio=audio;teamVoicePlaying=true;setVoiceCaption(track.text,true);
        await new Promise((resolve,reject)=>{audio.addEventListener('ended',resolve,{once:true});audio.addEventListener('error',reject,{once:true});audio.play().catch(reject)});
        teamVoiceAudio=null;teamVoicePlaying=false;setVoiceCaption('',false);return true;
      }catch(_){teamVoiceAudio=null;teamVoicePlaying=false;setVoiceCaption('',false);return false;}
    }
    async function playTeamVoice(_ignoredTrack=null,manual=false){
      if(detailMode||teamVoicePlaying)return false;
      if(!manual&&(!teamVoiceEnabled||document.hidden))return false;
      const ok=await gpPlayCrispTrack(gpChooseCrispTrack(manual));
      updateVoiceButton(ok?undefined:'blocked');return ok;
    }
    async function testTeamVoice(){
      if(detailMode||teamVoicePlaying)return;
      const ok=await playTeamVoice(null,true);
      if(ok)showToast(tr('voicePlaying'));else showToast(tr('audioBlocked'),7000);
    }
    function scheduleNextTeamVoice(delay=TEAM_VOICE_INTERVAL_MS){
      clearTimeout(teamVoiceTimer);teamVoiceTimer=null;if(detailMode||!teamVoiceEnabled)return;
      teamVoiceTimer=setTimeout(async()=>{
        if(!teamVoiceEnabled||document.hidden||teamVoicePlaying){scheduleNextTeamVoice(TEAM_VOICE_RETRY_MS);return;}
        const ok=await playTeamVoice(null,false);scheduleNextTeamVoice(ok?TEAM_VOICE_INTERVAL_MS:TEAM_VOICE_RETRY_MS);
      },Math.max(1000,delay));
    }
    async function toggleTeamVoice(){
      if(detailMode)return;
      teamVoiceEnabled=!teamVoiceEnabled;
      try{localStorage.setItem('gpFemaleVoiceEnabled',teamVoiceEnabled?'1':'0')}catch(_){}
      if(!teamVoiceEnabled){clearTimeout(teamVoiceTimer);stopTeamVoiceAudio();updateVoiceButton();showToast(tr('voiceDisabled'));return;}
      updateVoiceButton();const ok=await playTeamVoice(null,true);
      if(ok)showToast(tr('voiceEnabled'));else showToast(tr('audioBlocked'),7000);
      scheduleNextTeamVoice();
    }
    function initialiseTeamVoice(){
      if(detailMode)return;
      try{teamVoiceEnabled=localStorage.getItem('gpFemaleVoiceEnabled')!=='0'}catch(_){teamVoiceEnabled=true}
      updateVoiceButton();if(teamVoiceEnabled)scheduleNextTeamVoice(7000);
    }

    async function confirmCollection(item, button) {
        const msg = currentLanguage === 'ar'
            ? `${tr('confirmPrefix')} ${item.service_id} ${tr('confirmSuffix')}\n${tr('closesCycle')} ${item.cycle_no}.`
            : `${tr('confirmPrefix')} ${item.service_id} ${tr('confirmSuffix')}\n${tr('closesCycle')} ${item.cycle_no}.`;
        if (!window.confirm(msg)) return;
        button.disabled = true; button.textContent = tr('saving');
        foregroundRefreshPending = true; setLoading(true, tr('saving'));
        try {
            const response = await fetch(apiUrl('/api/close-ticket'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ service_id:item.service_id, cycle_key:item.cycle_key }) });
            const result = await response.json();
            if (!response.ok || result.status !== 'success') throw new Error(result.message || tr('closeFailed'));
            showToast(`${tr('closed')} ${item.service_id} ${tr('currentCycle')}`);
            selectedTicketKey = null;
            await refreshDashboard(true);
        } catch (err) {
            foregroundRefreshPending = false; setLoading(false);
            showToast(err.message || String(err), 7000);
            button.disabled = false; button.textContent = tr('confirmClose');
        }
    }

    async function closeRemark(row, button) {
        button.disabled = true; button.textContent = tr('saving');
        foregroundRefreshPending = true; setLoading(true, tr('saving'));
        try {
            const response = await fetch(apiUrl('/api/delete-remark'), { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({row}) });
            const result = await response.json();
            if (!response.ok || result.status !== 'success') throw new Error(result.message || tr('remarkFail'));
            showToast(tr('remarkClosed'));
            await refreshDashboard(true);
        } catch (err) {
            foregroundRefreshPending = false; setLoading(false);
            showToast(err.message || String(err), 7000);
            button.disabled = false; button.textContent = tr('closeRemark');
        }
    }

    async function retrySync() {
        const pill = document.getElementById('syncPill');
        pill.disabled=true; pill.textContent=tr('checking');
        foregroundRefreshPending = true; setLoading(true, tr('connecting'));
        try {
            const response = await fetch(apiUrl('/api/health?reconnect=1'), {cache:'no-store'});
            const data = await response.json();
            if (data.write_ready) showToast(tr('syncReady'));
            else showToast(data.write_error || tr('syncNotReady'), 8000);
        } catch (err) { foregroundRefreshPending = false; setLoading(false); showToast(String(err), 7000); }
        finally { pill.disabled=false; await refreshDashboard(true); }
    }

    let refreshInFlight = false;
    let remarksRefreshInFlight = false;

    async function refreshRemarks() {
        if (remarksRefreshInFlight) return;
        remarksRefreshInFlight = true;
        try {
            const response = await fetch(apiUrl(`/api/remarks?t=${Date.now()}`), {cache:'no-store'});
            if (!response.ok) return;
            const result = await response.json();
            if (!latestData) latestData = {};
            latestData.remarks_list = Array.isArray(result.remarks_list) ? result.remarks_list : [];
            document.getElementById('remarksCount').textContent = latestData.remarks_list.length;
            if (detailMode && activeCategory === 'remarks') renderRemarks();
        } catch (_) {
            // Remarks are secondary; never let them slow or interrupt the dashboard.
        } finally {
            remarksRefreshInFlight = false;
        }
    }

    async function refreshDashboard(force=false) {
        if (refreshInFlight) {
            if (force) foregroundRefreshPending = true;
            return;
        }

        const foreground = force || foregroundRefreshPending;
        if (foreground) {
            foregroundRefreshPending = true;
            setLoading(true, force ? tr('refreshing') : tr('loading'));
        }

        refreshInFlight = true;
        let pollAgain = false;
        try {
            const forceArg = force ? '&force=1' : '';
            const response = await fetch(apiUrl(`/api/data?t=${Date.now()}${forceArg}`), {cache:'no-store'});
            if (!response.ok) throw new Error(`API ${response.status}`);
            const incoming = await response.json();
            const existingRemarks = latestData && Array.isArray(latestData.remarks_list)
                ? latestData.remarks_list : [];
            latestData = incoming;
            if (!Array.isArray(latestData.remarks_list) || latestData.remarks_list.length === 0) {
                latestData.remarks_list = existingRemarks;
            }
            updateConnection(latestData);
            updateMain(latestData);
            if (detailMode) renderTicketList();

            const busy = Boolean(incoming && (incoming.loading || incoming.refreshing));
            if (busy) {
                pollAgain = true;
                if (foregroundRefreshPending) setLoading(true, tr('refreshing'));
            } else {
                saveDashboardSnapshot(latestData);
                foregroundRefreshPending = false;
                setLoading(false);
            }
        } catch (err) {
            foregroundRefreshPending = false;
            setLoading(false);
            const lastSync = document.getElementById('lastSync');
            if (lastSync) lastSync.textContent = `${tr('refreshFailed')}: ${err.message || err}`;
        } finally {
            refreshInFlight = false;
            if (pollAgain) setTimeout(() => refreshDashboard(false), 700);
        }
    }

    document.querySelectorAll('.workflow-card').forEach(btn => btn.addEventListener('click', () => openCategory(btn.dataset.category)));
    document.getElementById('remarksButton').addEventListener('click', () => openCategory('remarks'));
    document.getElementById('syncPill').addEventListener('click', retrySync);
    document.getElementById('voiceButton').addEventListener('click', () => { try { toggleTeamVoice(); } catch (_) {} });
    document.getElementById('voiceTestButton').addEventListener('click', () => { try { testTeamVoice(); } catch (_) {} });
    document.getElementById('languageSelect').addEventListener('change', e => {
        currentLanguage = e.target.value === 'ar' ? 'ar' : 'en';
        try { localStorage.setItem('gpDashboardLanguage', currentLanguage); } catch (_) {}
        const u = new URL(window.location.href); u.searchParams.set('lang', currentLanguage); history.replaceState({},'',u);
        stopTeamVoiceAudio();
        teamVoicePlaying=false; setVoiceCaption('',false);
        applyLanguage();
        if (latestData) { updateConnection(latestData); updateMain(latestData); if(detailMode) renderTicketList(); }
        if (!latestData || latestData.loading || latestData.refreshing) refreshDashboard(true);
    });
    document.getElementById('mainButton').addEventListener('click', () => { if (window.opener) window.close(); else window.location.href=`/?lang=${encodeURIComponent(currentLanguage)}`; });
    document.getElementById('closeWindowButton').addEventListener('click', () => { if (window.opener) window.close(); else window.location.href=`/?lang=${encodeURIComponent(currentLanguage)}`; });
    document.getElementById('refreshButton').addEventListener('click', () => refreshDashboard(true));
    document.getElementById('searchBox').addEventListener('input', renderTicketList);

    applyLanguage();
    configureView();
    updateClock();
    setInterval(updateClock, 1000);

    // Instant main-TV warm start from the previous successful summary, while the
    // authoritative live Ledger refresh begins immediately in the background.
    const warmSnapshot = loadDashboardSnapshot();
    if (warmSnapshot) {
        latestData = warmSnapshot;
        updateConnection(latestData);
        updateMain(latestData);
        setLoading(false);
    } else {
        setLoading(false);
        const lastSync = document.getElementById('lastSync');
        if (lastSync) lastSync.textContent = currentLanguage === 'ar' ? 'جارٍ جلب البيانات المباشرة…' : 'Connecting to live data…';
    }
    refreshDashboard(false);
    setTimeout(refreshRemarks, 1800);
    setTimeout(() => { try { initialiseTeamVoice(); } catch (_) {} }, 800);
    setInterval(() => refreshDashboard(false), 15000);
    setInterval(refreshRemarks, 60000);
})();
</script>
</body>
