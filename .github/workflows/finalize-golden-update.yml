name: Finalize Golden Palace update
on:
  push:
    branches: [main]
    paths:
      - '.deploy_parts/FINAL'
permissions:
  contents: write
jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested patches to current source
        shell: bash
        run: |
          python - <<'PY'
          import re, base64, gzip
          from pathlib import Path
          sources={
            'tools_tracker.py':('.github/workflows/apply-golden-update.yml','TOOLS_PATCH_B64'),
            'flask_app.py':('.github/workflows/merge-golden-update.yml','FLASK_PATCH_B64'),
            'templates/tv.html':('.github/workflows/merge-golden-update.yml','TV_PATCH_B64'),
          }
          for idx,(target,(workflow,key)) in enumerate(sources.items()):
              text=Path(workflow).read_text(encoding='utf-8')
              m=re.search(r'^\s*'+re.escape(key)+r':\s*(\S+)\s*$',text,re.M)
              if not m:
                  raise SystemExit('missing embedded patch '+key)
              Path(f'/tmp/p{idx}.patch').write_bytes(gzip.decompress(base64.b64decode(m.group(1))))
          PY

          set +e
          patch --merge=diff3 tools_tracker.py < /tmp/p0.patch
          patch --merge=diff3 flask_app.py < /tmp/p1.patch
          patch --merge=diff3 templates/tv.html < /tmp/p2.patch
          set -e

          python - <<'PY'
          from pathlib import Path
          def keep_current_on_conflict(path):
              lines=Path(path).read_text(encoding='utf-8').splitlines(keepends=True)
              out=[]; i=0
              while i < len(lines):
                  if lines[i].startswith('<<<<<<<'):
                      i+=1; ours=[]
                      while i < len(lines) and not lines[i].startswith('|||||||') and not lines[i].startswith('======='):
                          ours.append(lines[i]); i+=1
                      if i < len(lines) and lines[i].startswith('|||||||'):
                          i+=1
                          while i < len(lines) and not lines[i].startswith('======='):
                              i+=1
                      if i >= len(lines): raise SystemExit('bad conflict in '+path)
                      i+=1
                      while i < len(lines) and not lines[i].startswith('>>>>>>>'):
                          i+=1
                      if i >= len(lines): raise SystemExit('bad conflict in '+path)
                      i+=1; out.extend(ours)
                  else:
                      out.append(lines[i]); i+=1
              Path(path).write_text(''.join(out),encoding='utf-8')
          for p in ['tools_tracker.py','flask_app.py','templates/tv.html']:
              keep_current_on_conflict(p)
          PY

          python -m py_compile tools_tracker.py flask_app.py
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('templates/tv.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('TV script missing')
          Path('/tmp/tv.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/tv.js'],check=True)
          for p in ['tools_tracker.py','flask_app.py','templates/tv.html']:
              t=Path(p).read_text(encoding='utf-8')
              if '<<<<<<<' in t or '>>>>>>>' in t or '\n=======' in t or '\n|||||||' in t:
                  raise SystemExit('unresolved conflict marker in '+p)
          PY
      - name: Commit validated merged source
        shell: bash
        run: |
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools_tracker.py flask_app.py templates/tv.html
          git rm -r .deploy_parts
          rm -f .github/workflows/apply-golden-update.yml .github/workflows/apply-golden-update-fix.yml .github/workflows/merge-golden-update.yml .github/workflows/resolve-golden-update.yml .github/workflows/finalize-golden-update.yml
          git add -A .github/workflows
          git commit -m 'Finalize Golden Palace performance and stock updates'
          git push origin main
