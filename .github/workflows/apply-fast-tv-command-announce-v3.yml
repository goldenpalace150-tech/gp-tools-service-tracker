name: Apply Fast TV Command and Announcement V4

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_tv_real_motion_announce_v4.py
      - scripts/fix_announce_v4_copy.py
      - scripts/remove_legacy_tv_v3_controls.py
      - .github/workflows/apply-fast-tv-command-announce-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gp-fast-tv-command-announce-v4
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V4 fixes only
        run: |
          python scripts/apply_tv_real_motion_announce_v4.py
          python scripts/fix_announce_v4_copy.py
          python scripts/remove_legacy_tv_v3_controls.py

      - name: Validate Python
        run: python -m py_compile tools_tracker.py flask_app.py scripts/apply_tv_real_motion_announce_v4.py scripts/fix_announce_v4_copy.py scripts/remove_legacy_tv_v3_controls.py

      - name: Validate TV JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('templates/tv.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline TV scripts found')
          Path('/tmp/tv-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/tv-inline.js

      - name: Validate announcement template
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('templates/announce.html').read_text(encoding='utf-8')
          required = ['GP_ANNOUNCE_V4','GP_ANNOUNCE_V4_COPY_FIX','manual-announcement/status','published_sender','gpLoadingOverlay','5 ثوانٍ']
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('Announcement template missing: ' + ', '.join(missing))
          if 'تم الاطلاعd' in text:
              raise SystemExit('Bad acknowledgment copy remains')
          if text.count('<script>') != text.count('</script>'):
              raise SystemExit('Unbalanced announcement script tags')
          PY

      - name: Verify V4 behavior and reject legacy UI
        run: |
          grep -q 'GP_ACK_MAX_5S_V4' tools_tracker.py
          grep -q 'GP_ANNOUNCE_AND_MOTION_V4' flask_app.py
          grep -q 'GP_TV_REAL_MOTION_V4' templates/tv.html
          grep -q 'navigator.mediaDevices.getUserMedia' templates/tv.html
          grep -q 'gpPlayTvPoliceAlert' templates/tv.html
          grep -q 'id="fullscreenButton"' templates/tv.html
          grep -q 'id="motionVoiceButton"' templates/tv.html
          grep -q 'direction:rtl' templates/tv.html
          grep -q 'GP_ANNOUNCE_V4_COPY_FIX' templates/announce.html
          ! grep -q 'GP_TV_LAYOUT_FULLSCREEN_MOVEMENT_V3' templates/tv.html
          ! grep -q 'gpTvFloatingControls' templates/tv.html
          ! grep -q 'gpFullscreenToggle' templates/tv.html
          ! grep -q "pointerTimer=setTimeout(()=>speakFunnyInteraction" templates/tv.html
          git diff --check

      - name: Commit applied sources
        run: |
          if git diff --quiet -- tools_tracker.py flask_app.py templates/tv.html templates/announce.html; then
            echo 'No app changes required.'
            exit 0
          fi
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools_tracker.py flask_app.py templates/tv.html templates/announce.html
          git commit -m 'Remove legacy TV controls and keep V4 only'
          git push origin main
