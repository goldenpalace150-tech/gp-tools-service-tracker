name: Apply Manual TV Announcement

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_manual_tv_announcement.py
      - scripts/apply_manual_tv_voice_toggle.py
      - scripts/apply_tv_control_instant_push.py
      - scripts/apply_management_announce_page.py
      - scripts/apply_announcement_delivery_ack.py
      - scripts/apply_tv_human_ack_color_voice_v1.py
      - templates/announce.html
      - .github/workflows/apply-manual-tv-announcement.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply announcement feature
        run: python scripts/apply_manual_tv_announcement.py
      - name: Apply voice toggle
        run: python scripts/apply_manual_tv_voice_toggle.py
      - name: Apply TV control and instant push
        run: python scripts/apply_tv_control_instant_push.py
      - name: Apply management announcement page
        run: python scripts/apply_management_announce_page.py
      - name: Apply delivery acknowledgement and Arabic speech
        run: python scripts/apply_announcement_delivery_ack.py
      - name: Apply human acknowledgement, color parity, and delayed voice control
        run: python scripts/apply_tv_human_ack_color_voice_v1.py
      - name: Validate Python
        run: python -m py_compile tools_tracker.py flask_app.py
      - name: Validate TV inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('templates/tv.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          Path('/tmp/tv-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/tv-inline.js
      - name: Validate management page
        run: |
          test -s templates/announce.html
          grep -q 'Live TV Announcement' templates/announce.html
          grep -q 'GP_MANAGEMENT_ANNOUNCE_PAGE_V1' flask_app.py
          grep -q '@app.route("/announce"' flask_app.py
          grep -q 'GP_ANNOUNCEMENT_DELIVERY_STATUS_UI_V1' templates/announce.html
          grep -q 'GP_HUMAN_ACK_STATUS_UI_V1' templates/announce.html
      - name: Verify feature markers
        run: |
          grep -q 'GP_MANUAL_TV_ANNOUNCEMENT_V1' tools_tracker.py
          grep -q 'GP_MANUAL_TV_ANNOUNCEMENT_API_V1' flask_app.py
          grep -q 'GP_MANUAL_TV_ANNOUNCEMENT_RUNTIME_V1' templates/tv.html
          grep -q 'GP_MANUAL_TV_VOICE_TOGGLE_V1' tools_tracker.py
          grep -q 'GP_TV_CONTROL_AND_PUSH_V1' tools_tracker.py
          grep -q 'GP_ANNOUNCEMENT_DELIVERY_ACK_V1' flask_app.py
          grep -q 'GP_HUMAN_ACK_AND_DELAYED_CONTROL_V1' flask_app.py
          grep -q 'GP_HUMAN_ACK_BUTTON_V1' templates/tv.html
          grep -q 'GP_LIVE_CRISP_VOICE_V1' templates/tv.html
          grep -q 'GP_DELAYED_VOICE_CONTROL_V1' tools_tracker.py
          grep -q 'GP_DELAYED_VOICE_RUNTIME_V1' templates/tv.html
          grep -q 'GP_PC_COLOR_PARITY_AND_TAB_FIX_V1' templates/tv.html
      - name: Commit applied files
        run: |
          if git diff --quiet -- tools_tracker.py flask_app.py templates/tv.html templates/announce.html; then
            echo 'No app changes required.'
            exit 0
          fi
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools_tracker.py flask_app.py templates/tv.html templates/announce.html
          git commit -m 'Add human TV acknowledgment and dashboard parity'
          git push