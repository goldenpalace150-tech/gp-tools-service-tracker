name: Migrate TV frontend to Supabase v10

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_frontend_to_supabase_v10.py'
      - '.github/workflows/migrate-supabase-tv-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration patch
        run: python scripts/migrate_frontend_to_supabase_v10.py
      - name: Validate Python
        run: python -m py_compile tools_tracker.py
      - name: Validate TV migration markers
        run: |
          grep -q 'cqpmcqypwzlunskeeoml.supabase.co/functions/v1/gp-api' templates/tv.html
          grep -q 'data:|blob:' templates/tv.html
          grep -q 'cqpmcqypwzlunskeeoml.supabase.co/functions/v1/gp-api' tools_tracker.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/tv.html tools_tracker.py
          git commit -m 'Migrate TV and staff control to Supabase runtime'
          git push
