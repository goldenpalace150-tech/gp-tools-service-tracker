name: Deploy GitHub Pages smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site-test/**'
      - '.github/workflows/deploy-pages-smoke-test.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-test
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
