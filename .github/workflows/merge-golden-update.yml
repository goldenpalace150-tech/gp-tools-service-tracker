name: Merge Golden Palace tested update
on:
  push:
    branches: [main]
    paths:
      - '.deploy_parts/READY3'
permissions:
  contents: write
jobs:
  merge-tested-update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build desired versions and merge with current main
        shell: bash
        env:
          FLASK_PATCH_B64: 
          TV_PATCH_B64: 
        run: |
          python - <<'PY'
          import os,re,base64,gzip,subprocess
          from pathlib import Path

          configs=[
              ('tools_tracker.py','7ba41dbdff694d04d25ac8fa4d26b04ecd15cfc4',None),
              ('flask_app.py','1c0c51160985c74883b20cec5c4a61a4b149c88b','FLASK_PATCH_B64'),
              ('templates/tv.html','2264a9171042675d386e56e64fe272fa18a60322','TV_PATCH_B64'),
          ]

          workflow=Path('.github/workflows/apply-golden-update.yml').read_text()
          m=re.search(r'^\s*TOOLS_PATCH_B64:\s*(\S+)\s*$',workflow,re.M)
          if not m:
              raise SystemExit('tools patch missing')
          tools_patch=m.group(1)

          for idx,(target,base_sha,env_name) in enumerate(configs):
              base=Path(f'/tmp/base{idx}')
              desired=Path(f'/tmp/desired{idx}')
              patchfile=Path(f'/tmp/change{idx}.patch')
              merged=Path(f'/tmp/merged{idx}')
              with base.open('wb') as fh:
                  subprocess.run(['git','cat-file','blob',base_sha],stdout=fh,check=True)
              desired.write_bytes(base.read_bytes())
              encoded=tools_patch if idx==0 else os.environ[env_name]
              patchfile.write_bytes(gzip.decompress(base64.b64decode(encoded)))
              subprocess.run(['patch',str(desired)],stdin=patchfile.open('rb'),check=True)
              with merged.open('wb') as fh:
                  proc=subprocess.run(['git','merge-file','-p',target,str(base),str(desired)],stdout=fh)
              if proc.returncode != 0:
                  print(merged.read_text(errors='replace'))
                  raise SystemExit(f'merge conflict in {target}')
              Path(target).write_bytes(merged.read_bytes())
          PY
          python -m py_compile tools_tracker.py flask_app.py
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('templates/tv.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts: raise SystemExit('tv script missing')
          Path('/tmp/tv.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/tv.js'],check=True)
          PY
      - name: Commit merged sources
        shell: bash
        run: |
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools_tracker.py flask_app.py templates/tv.html
          git rm -r .deploy_parts .github/workflows/apply-golden-update.yml .github/workflows/apply-golden-update-fix.yml .github/workflows/merge-golden-update.yml
          git commit -m 'Merge performance, stock import and loading updates'
          git push origin main
