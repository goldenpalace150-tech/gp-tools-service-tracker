        :root { --gp-navy:#071a2d; --gp-navy2:#0c2945; --gp-gold:#d5a62e; --gp-gold-soft:#f6e8b8; }
        body { background: radial-gradient(circle at 12% 0%, #eef5ff 0, #f6f8fb 38%, #eef2f7 100%); }
        .topbar { background: linear-gradient(125deg,var(--gp-navy),var(--gp-navy2)); border-color:rgba(213,166,46,.55); color:#fff; box-shadow:0 14px 34px rgba(7,26,45,.18); }
        .brand h1,.brand small { color:#fff !important; }
        .pill,.action-btn { min-height:44px; border-radius:12px; }
        .topbar .pill,.topbar .action-btn,.topbar select { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.22); backdrop-filter:blur(6px); }
        .topbar .pill:hover,.topbar .action-btn:hover { background:rgba(255,255,255,.18); }
        .workflow-card { border:1px solid rgba(148,163,184,.32); box-shadow:0 8px 26px rgba(15,23,42,.07); background:linear-gradient(160deg,#fff 0%,#fbfdff 100%); }
        .workflow-card::before { content:""; position:absolute; width:115px; height:115px; border-radius:50%; right:-36px; top:-42px; background:color-mix(in srgb,var(--accent) 11%,transparent); }
        .workflow-card:hover { transform:translateY(-2px) scale(1.006); }
        .summary-item,.detail-toolbar,.ticket-panel,.stat,.remark-row { box-shadow:0 5px 18px rgba(15,23,42,.05); }
        .summary-item b { color:var(--gp-navy); }
        button:focus-visible,input:focus-visible,select:focus-visible,.workflow-card:focus-visible { outline:3px solid #f0be3f !important; outline-offset:3px !important; }
        .ticket-row:focus-visible { outline:3px solid #2563eb; outline-offset:2px; }
        .voice-caption { border:1px solid rgba(213,166,46,.65); box-shadow:0 12px 32px rgba(0,0,0,.24); }
        html[dir="ltr"] .voice-caption { direction:ltr; }
        html[dir="rtl"] .voice-caption { direction:rtl; }
        @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important; } }
        @media (max-width:900px) {
            .page { width:min(100% - 14px,1500px); }
            .topbar { align-items:flex-start; }
            .top-actions { gap:6px; }
            .pill,.action-btn { min-height:46px; }
        }
    </style>
</head>''', 1)

