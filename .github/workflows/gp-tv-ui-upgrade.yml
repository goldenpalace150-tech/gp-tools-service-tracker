      - name: Validate Python and TV JavaScript
        run: |
          python -m py_compile tools_tracker.py flask_app.py
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('templates/tv.html').read_text(encoding='utf-8')
          script=re.findall(r'<script>(.*?)</script>',html,re.S)[-1]
          Path('/tmp/tv.js').write_text(script,encoding='utf-8')
          required=['GP_UI_REFRESH_2026_09_08','ar-SY','حريري','أبو غسان','حازم','GP_BACKEND_ORIGIN','buildDynamicVoiceTrack']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing TV markers: '+str(missing))
          app=Path('tools_tracker.py').read_text(encoding='utf-8')
          if 'GP_APP_UI_REFRESH_2026_09_08' not in app: raise SystemExit('App UI marker missing')
          flask=Path('flask_app.py').read_text(encoding='utf-8')
          if 'GP_RENDER_STATIC_CORS_2026_09_08' not in flask: raise SystemExit('CORS marker missing')
          PY
          node --check /tmp/tv.js
