    function gpPick(items){ return items[Math.floor(Math.random()*items.length)]; }
    function gpRecentVoice(){ try { return JSON.parse(localStorage.getItem('gpVoiceRecentV5')||'[]'); } catch(_){ return []; } }
    function gpRememberVoice(text){ try { const a=gpRecentVoice().filter(x=>x!==text); a.push(text); localStorage.setItem('gpVoiceRecentV5',JSON.stringify(a.slice(-80))); } catch(_){} }
    function buildDynamicVoiceTrack(){
        const lang=currentLanguage==='ar'?'ar':'en', b=GP_VOICE_BANK[lang], staff=GP_STAFF[lang];
        const r=Math.random(), name=gpPick(staff); let text='', category='motivation', tone='warm';
        if(r<0.28){ category='funny'; tone='funny'; text=`${gpPick(b.starts)}، ${gpPick(b.funny)}. ${gpPick(b.ends)}.`; }
        else if(r<0.52){ category='person'; tone=Math.random()<0.55?'funny':'warm'; text=`${gpPick(b.person).replace('{name}',name)}. ${gpPick(b.ends)}.`; }
        else if(r<0.82){ category='motivation'; text=`${gpPick(b.starts)}، ${gpPick(b.motivation)}، ${gpPick(b.action)}. ${gpPick(b.ends)}.`; }
        else { category='workshop'; text=`${gpPick(b.starts)}، ${gpPick(b.action)}. ${gpPick(b.motivation)}. ${gpPick(b.ends)}.`; }
        return {id:`dyn-${Date.now()}-${Math.random().toString(36).slice(2,8)}`,category,person:name,text:text.replace(/\s+/g,' ').trim(),url:'',lang,tone};
    }
    function chooseVoiceTrack(){
        const recent=gpRecentVoice(); let track=buildDynamicVoiceTrack();
        for(let i=0;i<30 && recent.includes(track.text);i++) track=buildDynamicVoiceTrack();
        gpRememberVoice(track.text); return track;
    }
    function speakFallback(track){
        if(!('speechSynthesis' in window) || !track) return false;
        try{
            const u=new SpeechSynthesisUtterance(track.text);
            const isAr=track.lang==='ar';
            u.lang=isAr?'ar-SY':'en-US';
            u.rate=track.tone==='funny'?1.12:1.03;
            u.pitch=track.tone==='funny'?1.34:1.18;
            u.volume=1.0;
            const voices=window.speechSynthesis.getVoices();
            const femaleHints=['female','zira','samantha','sara','salma','hoda','laila','layla','maryam','mariam','nora','rana','jenny','aria','ava','emma'];
            const female=v=>femaleHints.some(h=>String(v.name||'').toLowerCase().includes(h));
            const lang=v=>String(v.lang||'').toLowerCase();
            let preferred=null;
            if(isAr){
                preferred=voices.find(v=>lang(v).startsWith('ar-sy')&&female(v)) || voices.find(v=>lang(v).startsWith('ar-sy')) || voices.find(v=>lang(v).startsWith('ar')&&female(v)) || voices.find(v=>lang(v).startsWith('ar'));
            } else {
                preferred=voices.find(v=>lang(v).startsWith('en')&&female(v)) || voices.find(v=>lang(v).startsWith('en-us')) || voices.find(v=>lang(v).startsWith('en'));
            }
            if(preferred) u.voice=preferred;
            u.onend=()=>{teamVoicePlaying=false;setVoiceCaption('',false);};
            u.onerror=()=>{teamVoicePlaying=false;setVoiceCaption('',false);};
            teamVoicePlaying=true; setVoiceCaption(track.text,true);
            window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); return true;
        }catch(_){ return false; }
    }
    function playTeamVoice(track,manual=false){
        if(!track||detailMode||teamVoicePlaying) return false;
        if(!manual&&(!teamVoiceEnabled||document.hidden)) return false;
        stopTeamVoiceAudio();
        return speakFallback(track);
    }

