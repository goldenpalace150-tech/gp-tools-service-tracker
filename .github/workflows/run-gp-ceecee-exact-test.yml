name: Run GP Crisp Female Voice
on:
  push:
    paths:
      - scripts/apply_gp_ceecee_activation_v2.py
      - .github/workflows/run-gp-ceecee-exact-test.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply approved Crisp female catalog
        run: python scripts/apply_gp_ceecee_activation_v2.py
      - name: Validate TV JavaScript and catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('templates/tv.html').read_text(encoding='utf-8')
          required=['GP_CRISP_FEMALE_V6','GP_CRISP_REFERENCE_URL','GP_CRISP_STAFF','GP_CRISP_GENERAL','أبو عدنان','غبيطي','أبو نقطة','عمر','أبو آدم','حريري','أبو غسان','حازم','Enable / Disable','تفعيل / إيقاف']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing Crisp markers: '+str(missing))
          assert html.rfind('GP_CRISP_FEMALE_V6') > html.rfind('GP_LEVANTINE_VOICE_V4')
          assert 'playTeamVoice(null,true)' in html
          script=re.findall(r'<script>(.*?)</script>',html,re.S)[-1]
          Path('/tmp/tv.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/tv.js
      - name: Validation pass 2
        run: |
          node --check /tmp/tv.js
          python - <<'PY'
          from pathlib import Path
          tv=Path('templates/tv.html').read_text(encoding='utf-8')
          assert "name:'غبيطي'" in tv
          assert "name:'خبيطي'" not in tv
          assert '6d20d63a-a250-4239-b5a7-073ce8952f1d.mp3' in tv
          assert '6e7f4e37-7702-465a-8e2c-f84bed3c7195.mp3' in tv
          assert '953aa18a-cab4-441e-a902-c4b57dde2873.mp3' in tv
          print('غبيطي accountant Crisp validation OK')
          PY
      - name: Commit verified TV voice update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/tv.html
          git diff --cached --quiet && exit 0
          git commit -m "Use approved Crisp female voice catalog on TV"
          git push