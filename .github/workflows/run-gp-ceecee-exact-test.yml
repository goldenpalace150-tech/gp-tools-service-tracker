name: Run GP Exact Ceecee Voice
on:
  push:
    paths:
      - scripts/apply_gp_ceecee_exact_test.py
      - scripts/apply_gp_ceecee_activation_v2.py
      - .github/workflows/run-gp-ceecee-exact-test.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact Ceecee test voice
        run: python scripts/apply_gp_ceecee_exact_test.py
      - name: Apply exact Ceecee activation rotation
        run: python scripts/apply_gp_ceecee_activation_v2.py
      - name: Validate TV JavaScript and Ceecee paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('templates/tv.html').read_text(encoding='utf-8')
          required=['GP_CEECEE_EXACT_TEST_V1','GP_CEECEE_ACTIVATION_V2','1cd326303dc3411eaa9fcda84ee7b921','Enable / Disable','تفعيل / إيقاف','chooseCeeceeActivationTrack']
          missing=[x for x in required if x not in html]
          if missing: raise SystemExit('Missing markers: '+str(missing))
          script=re.findall(r'<script>(.*?)</script>',html,re.S)[-1]
          Path('/tmp/tv.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/tv.js
      - name: Commit verified TV voice update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/tv.html
          git diff --cached --quiet && exit 0
          git commit -m "Use exact original Ceecee voice for activation rotation"
          git push
