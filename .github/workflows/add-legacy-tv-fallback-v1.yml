name: Add legacy Smart TV fallback v1

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_legacy_tv_fallback_v1.py'
      - '.github/workflows/add-legacy-tv-fallback-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply legacy TV fallback
        run: python scripts/add_legacy_tv_fallback_v1.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          text=Path('templates/tv.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S|re.I)
          if not scripts:
              raise SystemExit('No inline scripts found')
          for i, code in enumerate(scripts, 1):
              p=Path(f'/tmp/tv-legacy-{i}.js')
              p.write_text(code, encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)], text=True, capture_output=True)
              if r.returncode:
                  print(r.stdout)
                  print(r.stderr, file=sys.stderr)
                  raise SystemExit(r.returncode)
          print(f'Validated {len(scripts)} inline script(s)')
          PY
      - name: Verify legacy fallback marker
        run: grep -q 'GP_LEGACY_TV_FALLBACK_V1' templates/tv.html
      - name: Commit generated TV fallback
        shell: bash
        run: |
          if git diff --quiet -- templates/tv.html; then
            echo 'No TV changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add templates/tv.html
          git commit -m 'Add legacy Smart TV data fallback'
          git push origin main
