name: Resolve Golden Palace tested update
on:
  push:
    branches: [main]
    paths:
      - '.deploy_parts/READY4'
permissions:
  contents: write
jobs:
  resolve-update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge tested changes while preserving newer UI
        shell: bash
        run: |
          python - <<'PY'
          import re, base64, gzip, subprocess
          from pathlib import Path

          apply_text = Path('.github/workflows/apply-golden-update.yml').read_text()
          merge_text = Path('.github/workflows/merge-golden-update.yml').read_text()

          def embedded(text, name):
              m = re.search(r'^\s*'+re.escape(name)+r':\s*(\S+)\s*$', text, re.M)
              if not m:
                  raise SystemExit('missing embedded patch: '+name)
              return m.group(1)

          configs = [
              ('tools_tracker.py','7ba41dbdff694d04d25ac8fa4d26b04ecd15cfc4',embedded(apply_text,'TOOLS_PATCH_B64')),
              ('flask_app.py','1c0c51160985c74883b20cec5c4a61a4b149c88b',embedded(merge_text,'FLASK_PATCH_B64')),
              ('templates/tv.html','2264a9171042675d386e56e64fe272fa18a60322',embedded(merge_text,'TV_PATCH_B64')),
          ]

          for idx,(target,base_sha,encoded) in enumerate(configs):
              base=Path(f'/tmp/base{idx}')
              desired=Path(f'/tmp/desired{idx}')
              patchfile=Path(f'/tmp/change{idx}.patch')
              merged=Path(f'/tmp/merged{idx}')
              with base.open('wb') as fh:
                  subprocess.run(['git','cat-file','blob',base_sha],stdout=fh,check=True)
              desired.write_bytes(base.read_bytes())
              patchfile.write_bytes(gzip.decompress(base64.b64decode(encoded)))
              with patchfile.open('rb') as pin:
                  subprocess.run(['patch',str(desired)],stdin=pin,check=True)
              with merged.open('wb') as fh:
                  subprocess.run(['git','merge-file','--ours','-p',target,str(base),str(desired)],stdout=fh,check=True)
              Path(target).write_bytes(merged.read_bytes())
          PY
          python -m py_compile tools_tracker.py flask_app.py
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          html=Path('templates/tv.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              raise SystemExit('tv script missing')
          Path('/tmp/tv.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/tv.js'],check=True)
          for p in ['tools_tracker.py','flask_app.py','templates/tv.html']:
              text=Path(p).read_text(encoding='utf-8')
              if '<<<<<<<' in text or '>>>>>>>' in text or '\n=======' in text:
                  raise SystemExit('unresolved conflict marker in '+p)
          PY
      - name: Commit final synchronized sources
        shell: bash
        run: |
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools_tracker.py flask_app.py templates/tv.html
          git rm -r .deploy_parts .github/workflows/apply-golden-update.yml .github/workflows/apply-golden-update-fix.yml .github/workflows/merge-golden-update.yml .github/workflows/resolve-golden-update.yml
          git commit -m 'Merge performance, stock import and loading updates'
          git push origin main
