name: Apply Follow-Up TV Auto Slides

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-followup-tv-slides.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply follow-up TV patch
        run: python .github/scripts/apply_followup_tv.py

      - name: Validate Python and TV JavaScript
        shell: bash
        run: |
          python -m py_compile flask_app.py
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('templates/tv.html').read_text(encoding='utf-8')
          assert 'GP_FOLLOWUP_AUTO_SLIDES_V3' in html
          assert 'updateFollowupSlideshow(data);' in html
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', html, flags=re.S | re.I)
          Path('/tmp/gp-tv.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/gp-tv.js
          grep -q 'GP_FOLLOWUP_VOICE_V2' flask_app.py
          grep -q '/api/followup-voice' flask_app.py

      - name: Commit tested source
        shell: bash
        run: |
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add templates/tv.html flask_app.py
          if git diff --cached --quiet; then
            echo 'No source changes needed'
            exit 0
          fi
          git commit -m 'Add TV follow-up auto slides and case announcements'
          git push origin HEAD:main
