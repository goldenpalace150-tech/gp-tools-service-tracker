name: Apply Golden Palace update
on:
  push:
    branches: [main]
    paths:
      - '.deploy_parts/**'
permissions:
  contents: write
jobs:
  apply-update:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested Tools Tracker patch
        shell: bash
        env:
          TOOLS_PATCH_B64: 
        run: |
          python - <<'PY'
          import os,base64,gzip
          from pathlib import Path
          Path('/tmp/tools.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['TOOLS_PATCH_B64'])))
          PY
          patch -p0 < /tmp/tools.patch
          python -m py_compile tools_tracker.py
      - name: Commit update
        shell: bash
        run: |
          git config user.name 'Golden Palace Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tools_tracker.py
          git rm -r .deploy_parts .github/workflows/apply-golden-update.yml
          git commit -m 'Apply Golden Palace performance and stock import update'
          git push origin main
